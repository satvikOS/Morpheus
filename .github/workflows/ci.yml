name: Morpheus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web workstation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Research, volume and worker regression tests
        run: npm run test:worker

      - name: Production build
        run: npm run build

  gateway:
    name: Signal gateway syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local API test dependencies
        run: python -m pip install fastapi==0.118.0 pydantic==2.11.9 httpx==0.28.1 pynwb==4.2.0

      - name: Compile gateway and recording tools
        run: |
          python -m py_compile services/signal-gateway/app/main.py
          python -m py_compile services/signal-gateway/app/protocol.py
          python -m py_compile services/signal-gateway/app/model_runtime.py
          python -m py_compile services/signal-gateway/app/model_api.py
          python -m py_compile services/signal-gateway/tools/jsonl_to_nwb.py
          python -m py_compile services/signal-gateway/tools/mrph_to_nwb.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("data/schema").glob("*.json"):
              json.loads(path.read_text())
              print("validated", path)
          PY

  native-cpp:
    name: C++ protocol and acquisition core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable for cross-language parity
        uses: dtolnay/rust-toolchain@stable
      - name: Unit, Python/Rust parity and acquisition integration
        run: MORPHEUS_NATIVE_BUILD=/tmp/morpheus-cpp scripts/native-test.sh
      - name: Bounded cloud HTTP and service routing
        run: python3 scripts/native-cloud-test.py

  shared-model:
    name: Shared representation learning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model runtime
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Joint learning, independent-unit holdout and checkpoint regression
        run: |
          python -m unittest discover -s tests -p 'test_unified_model.py'
          python -m unittest discover -s tests -p 'test_model_predict_cli.py'

  native-core:
    name: Rust native engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Test native signal, protocol and DSP core
        run: cargo test --manifest-path native/morpheus-core/Cargo.toml

      - name: Compile native gateway
        run: cargo check --manifest-path native/morpheus-gateway/Cargo.toml
